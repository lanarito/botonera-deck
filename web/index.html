<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="/icons/botonera.png">
<link rel="apple-touch-icon" href="/icons/botonera.png">
<link rel="manifest" href="/manifest.json">
<title>Botonera</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: Roboto, Arial, sans-serif; }
  body {
    --size: 126px;
    --gap: 30px;
    --dgap: 22px;
    --lbl: 12px;
    --tabsH: 58px;
    background: #000;   /* negro total, como apagado: resaltan las luces */
  }
  .screw { position: absolute; width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8a8f97 0%, #4b4f56 45%, #22252a 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,.9), inset 0 -1px 2px rgba(0,0,0,.6), 0 0 0 3px rgba(0,0,0,.35); z-index: 2; }
  .screw::after { content: ""; position: absolute; left: 4px; right: 4px; top: 10px; height: 2px; background: #1a1c20;
    box-shadow: 0 1px 0 rgba(255,255,255,.18); transform: rotate(35deg); }

  #tabs { position: absolute; top: 0; left: 0; right: 0; height: var(--tabsH); display: flex; gap: 10px; align-items: center; justify-content: center; z-index: 3; padding: 0 8px; overflow-x: auto; }
  .tab { padding: 7px 22px; border-radius: 12px; font-size: 14px; font-weight: 700; letter-spacing: 1.5px; color: #8a929d; white-space: nowrap;
    background: #07080a; border: 1px solid #1c1f25; box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
  .tab.active { color: #fff; border-color: #5865F2; box-shadow: 0 0 16px -2px #5865F2, inset 0 0 12px -5px #5865F2; text-shadow: 0 0 8px #5865F2; }
  .tab.fs-tab { font-size: 16px; padding: 6px 14px; }
  body.compact .tab { padding: 5px 12px; font-size: 12px; border-radius: 10px; letter-spacing: 1px; }
  body.compact .tab.fs-tab { font-size: 14px; padding: 4px 10px; }

  #pages { position: absolute; top: var(--tabsH); left: 0; right: 0; bottom: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .page { display: none; width: 100%; height: 100%; box-sizing: border-box; padding: var(--padY, 8px) var(--padX, 12px); overflow: hidden; }
  .page.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  body.compact .page { padding: var(--padY, 6px) var(--padX, 8px); }
  /* deslizar entre paginas: entrada corta desde el lado del gesto */
  html, body { touch-action: none; }
  .page.active.inL { animation: inL .16s ease-out; } .page.active.inR { animation: inR .16s ease-out; }
  .page.active.inU { animation: inU .16s ease-out; } .page.active.inD { animation: inD .16s ease-out; }
  @keyframes inL { from { transform: translateX(60px);  opacity: .2; } to { transform: none; opacity: 1; } }
  @keyframes inR { from { transform: translateX(-60px); opacity: .2; } to { transform: none; opacity: 1; } }
  @keyframes inU { from { transform: translateY(50px);  opacity: .2; } to { transform: none; opacity: 1; } }
  @keyframes inD { from { transform: translateY(-50px); opacity: .2; } to { transform: none; opacity: 1; } }
  .grid { display: grid; gap: var(--gap); justify-content: center; align-content: center; }
  .dpad { display: grid; grid-template-columns: repeat(3, var(--size)); grid-template-rows: repeat(3, var(--size)); gap: var(--dgap); justify-content: center; align-content: center; margin: 10px auto 0; }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }

  .key { --c: #5865F2; --leak: .6; width: var(--size); height: var(--size); position: relative; touch-action: manipulation; }
  .well { position: absolute; top:0;left:0;right:0;bottom:0; border-radius: 26px;
    background: radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0) 0%, #040506 75%), #040506;
    box-shadow: inset 0 8px 14px rgba(0,0,0,.95), inset 0 -1px 0 rgba(255,255,255,.07), 0 1px 0 rgba(255,255,255,.09), 0 -1px 0 rgba(0,0,0,.6); }
  body.compact .well { border-radius: 16px; }
  body.compact .well::after, body.compact .well::before { border-radius: 13px; top: 4px; left: 4px; right: 4px; bottom: 2px; }
  body.compact .cap { border-radius: 13px; top: 4px; left: 4px; right: 4px; bottom: 4px; }
  body.compact .face { border-radius: 10px; top: 2px; left: 2px; right: 2px; bottom: 8px; }
  body.compact .key.pressed .cap { transform: translate3d(0, 4px, 0); }
  /* RAPIDO (tablet vieja): todo lo pesado (resplandores con desenfoque) se dibuja UNA vez en capas propias.
     Al apretar solo cambian transform y opacity, que mueve la placa de video sin redibujar. */
  .well::after { content: ""; position: absolute; top:6px;left:6px;right:6px;bottom:2px; border-radius: 22px;
    box-shadow: 0 0 28px 5px var(--c), 0 0 10px 1px var(--c), inset 0 0 20px 4px var(--c); opacity: .6;
    will-change: opacity; transform: translateZ(0); }
  .well::before { content: ""; position: absolute; top:6px;left:6px;right:6px;bottom:2px; border-radius: 22px; z-index: 0;
    box-shadow: 0 0 34px 8px var(--c), inset 0 0 26px 6px var(--c); opacity: 0;
    will-change: opacity; transform: translateZ(0); }
  .cap { position: absolute; top:7px;left:7px;right:7px;bottom:7px; border-radius: 21px;
    background: linear-gradient(180deg, #3a3e45 0%, #24272c 55%, #15171a 100%);
    box-shadow: 0 10px 14px rgba(0,0,0,.75), 0 2px 3px rgba(0,0,0,.8), 0 0 18px -3px var(--c);
    will-change: transform; transform: translate3d(0,0,0); }
  .face { position: absolute; top:2px;left:4px;right:4px;bottom:13px; border-radius: 17px;
    background:
      radial-gradient(ellipse at 50% 22%, rgba(255,255,255,.13) 0%, rgba(255,255,255,0) 55%),
      radial-gradient(ellipse at 50% 60%, #22252b 0%, #2a2e35 70%, #33373f 100%);
    box-shadow: inset 0 2px 1px rgba(255,255,255,.16), inset 0 -3px 5px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
  .halo { position: absolute; width: 70%; height: 70%; top: 8%; border-radius: 50%;
    background: radial-gradient(circle, var(--c) 0%, rgba(0,0,0,0) 65%); opacity: .22;
    will-change: opacity; transform: translateZ(0); }
  .face svg { position: relative; width: 46%; height: 46%; fill: var(--c); }
  .face img.ico { position: relative; width: 54%; height: 54%; object-fit: contain; }
  .lbl { position: relative; margin-top: 6px; font-size: var(--lbl); font-weight: 700; letter-spacing: 1px;
    color: #9aa1aa; text-shadow: 0 1px 0 rgba(255,255,255,.07), 0 -1px 0 rgba(0,0,0,.9); text-align: center; padding: 0 4px; line-height: 1.1; }
  .lamp { position: absolute; top: 10%; left: 50%; width: 26%; height: 6px; margin-left: -13%; border-radius: 3px;
    background: #1b1d21; box-shadow: inset 0 1px 2px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.06); }

  .key.pressed .cap { transform: translate3d(0,7px,0); }
  .key.pressed .well::before { opacity: .9; }
  .key.pressed .halo { opacity: .5; }

  .key.on .well::before { opacity: .7; }
  .key.on .lamp { background: var(--c); box-shadow: 0 0 6px var(--c), 0 0 16px var(--c), inset 0 1px 1px rgba(255,255,255,.55); }
  .key.on .halo { opacity: .55; }
  .key.on .lbl { color: #eef2f8; }
  .key.empty .well::after, .key.empty .well::before { display: none; }
  .key.empty .cap { box-shadow: 0 8px 12px rgba(0,0,0,.7), 0 2px 3px rgba(0,0,0,.8); }
  .key.empty svg { fill: #33373e; filter: none; }
  .key.empty .halo { opacity: 0; }
  .key.empty .lbl { color: #464b53; }

  #dot { position: absolute; right: 14px; bottom: 10px; width: 9px; height: 9px; border-radius: 50%; background: #c33; box-shadow: 0 0 8px #c33; z-index: 2; }
  #dot.ok { background: #2c4; box-shadow: 0 0 8px #2c4; }
</style>
</head>
<body>
<div id="tabs"></div>
<div id="pages"></div>
<div id="dot"></div>
<script>
  // ES5 + XMLHttpRequest. Paginas PRE-ARMADAS una sola vez -> cambio instantaneo.
  var dot = document.getElementById('dot');
  var pagesEl = document.getElementById('pages');
  var tabsEl = document.getElementById('tabs');
  var pages = [];
  var allKeys = [];

  function xhrGet(url, cb) {
    var x = new XMLHttpRequest(); x.open('GET', url, true);
    x.onreadystatechange = function () { if (x.readyState === 4) { cb((x.status >= 200 && x.status < 300) ? null : 1, x.responseText); } };
    try { x.send(); } catch (e) { cb(1, ''); }
  }
  function iconHtml(icon) {
    if (!icon) return '';
    if (icon.indexOf('svg:') === 0) return '<svg class="ico" viewBox="0 0 24 24"><path d="' + icon.substring(4) + '"/></svg>';
    return '<img class="ico" src="' + icon + '" alt="">';
  }

  function makeKey(b, empty) {
    var k = document.createElement('div');
    k.className = empty ? 'key empty' : 'key';
    var label = empty ? 'LIBRE' : (b.label || '');
    if (!empty) {
      if (b.id) k.setAttribute('data-id', b.id);
      k.setAttribute('data-off', b.label || '');
      if (b.labelOn) k.setAttribute('data-on', b.labelOn);
      if (b.toggle) k.setAttribute('data-lamp', '1');
      if (b.type === 'page') k.setAttribute('data-page', b.val || '');
      if (b.goto) k.setAttribute('data-goto', b.goto);
    }
    var icon = empty ? '<svg class="ico" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>' : iconHtml(b.icon);
    var lbl = label ? ('<div class="lbl">' + label + '</div>') : '';
    k.innerHTML = '<div class="well"></div><div class="cap"><div class="face">' +
      ((!empty && b.toggle) ? '<div class="lamp"></div>' : '') +
      '<div class="halo"></div>' + icon + lbl + '</div></div>';
    k.addEventListener('touchstart', down, { passive: false });
    k.addEventListener('touchend', up, { passive: false }); k.addEventListener('touchcancel', up);
    k.addEventListener('mousedown', down); k.addEventListener('mouseup', up); k.addEventListener('mouseleave', up);
    if (!empty && b.id) allKeys.push(k);
    return k;
  }

  var curSz = 126, curGap = 20, curCols = 8;
  function calcLayout() {
    var w = window.innerWidth || document.documentElement.clientWidth || 800;
    var h = window.innerHeight || document.documentElement.clientHeight || 600;

    var compact = w < 850 || h < 550;
    var tabsH = compact ? 42 : 54;
    var padX = compact ? 8 : 24;
    var padY = compact ? 6 : 14;
    var gap = compact ? 8 : 22;

    var availW = w - padX * 2;
    var availH = h - tabsH - padY * 2;

    var bestSz = 50, bestCols = 4;

    if (w >= 1000 && h >= 550) {
      // Tablet grande (Tab 2) o PC: 8 columnas de 126px
      bestCols = 8;
      bestSz = 126;
      gap = 24;
    } else {
      // Teléfono o pantalla chica: probar columnas (3 a 8) y buscar la que maximice
      // el tamaño del botón entrando TODO 100% dentro de la pantalla (sin scroll).
      // Se reservan 4 filas: es lo que necesita la pagina PITS (fila de 3 + cruz 3x3).
      // Asi ninguna pagina se sale, ni siquiera en pantalla completa.
      for (var c = 3; c <= 8; c++) {
        var r = Math.max(Math.ceil(15 / c), 4);
        var gX = (c - 1) * gap;
        var gY = (r - 1) * gap;
        var maxW = Math.floor((availW - gX) / c);
        var maxH = Math.floor((availH - gY) / r);
        var s = Math.min(maxW, maxH);
        if (s > 120) s = 120;
        if (s > bestSz) {
          bestSz = s;
          bestCols = c;
        }
      }
    }

    if (bestSz < 50) bestSz = 50;
    curSz = bestSz;
    curCols = bestCols;
    curGap = gap;

    var lbl = curSz < 76 ? 9 : (curSz < 94 ? 10 : (curSz < 112 ? 11 : 12));
    var st = document.body.style;
    st.setProperty('--size', curSz + 'px');
    st.setProperty('--gap', curGap + 'px');
    st.setProperty('--dgap', Math.max(6, Math.floor(curGap * 0.8)) + 'px');
    st.setProperty('--lbl', lbl + 'px');
    st.setProperty('--tabsH', tabsH + 'px');
    st.setProperty('--padX', padX + 'px');
    st.setProperty('--padY', padY + 'px');

    document.body.className = compact ? 'compact' : '';
  }

  function applyGridCols(cols, sz) {
    var gs = document.querySelectorAll('.grid');
    for (var i = 0; i < gs.length; i++) {
      gs[i].style.gridTemplateColumns = 'repeat(' + cols + ', ' + sz + 'px)';
    }
  }

  function fillGrid(grid, normalCount) {
    grid.style.gridTemplateColumns = 'repeat(' + curCols + ', ' + curSz + 'px)';
    var old = grid.querySelectorAll('.key.empty');
    for (var j = 0; j < old.length; j++) grid.removeChild(old[j]);
    // Solo rellenar en pantallas grandes de tablet/PC para completar la fila
    if (window.innerWidth >= 1000 && window.innerHeight >= 550) {
      var pad = Math.ceil(normalCount / curCols) * curCols;
      for (var i = normalCount; i < pad; i++) grid.appendChild(makeKey(null, true));
    }
  }

  var gridsMeta = [];
  function makePage(page) {
    var pageEl = document.createElement('div'); pageEl.className = 'page';
    var grid = document.createElement('div'); grid.className = 'grid';
    var dpadBtns = [], normal = [], i, b;
    var btns = page.buttons || [];
    for (i = 0; i < btns.length; i++) { b = btns[i]; if (b.dpad) dpadBtns.push(b); else normal.push(b); }
    for (i = 0; i < normal.length; i++) grid.appendChild(makeKey(normal[i], false));
    if (dpadBtns.length === 0) {
      fillGrid(grid, normal.length);
      gridsMeta.push({ grid: grid, count: normal.length });
    }
    pageEl.appendChild(grid);
    if (dpadBtns.length) {
      var dp = document.createElement('div'); dp.className = 'dpad';
      for (i = 0; i < dpadBtns.length; i++) { var kk = makeKey(dpadBtns[i], false); kk.className += ' ' + (dpadBtns[i].val || ''); dp.appendChild(kk); }
      pageEl.appendChild(dp);
    }
    return pageEl;
  }

  var cur = 0, lastVis = 0;
  function showPage(idx, anim) {
    cur = idx; if (pages[idx] && !pages[idx].hidden) lastVis = idx;
    var ps = pagesEl.children; for (var i = 0; i < ps.length; i++) ps[i].className = (i === idx ? ('page active' + (anim ? ' ' + anim : '')) : 'page');
    var ts = tabsEl.children; for (i = 0; i < ts.length; i++) ts[i].className = (parseInt(ts[i].getAttribute('data-pageidx'), 10) === idx ? 'tab active' : 'tab');
  }
  function goToPageByName(name) { for (var i = 0; i < pages.length; i++) { if ((pages[i].name || '') === name) { showPage(i); return; } } }

  function isFS() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
  }
  function toggleFS() {
    if (!isFS()) {
      var el = document.documentElement;
      var r = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
      if (r) { try { r.call(el); } catch (e) {} }
    } else {
      var c = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen;
      if (c) { try { c.call(document); } catch (e) {} }
    }
  }

  function buildTabs() {
    tabsEl.innerHTML = '';
    for (var i = 0; i < pages.length; i++) {
      if (pages[i].hidden) continue;
      (function (idx) {
        var t = document.createElement('div'); t.className = 'tab'; t.setAttribute('data-pageidx', idx); t.textContent = pages[idx].name || ('P' + (idx + 1));
        t.addEventListener('touchstart', function (ev) { ev.preventDefault(); showPage(idx); }, { passive: false });
        t.addEventListener('click', function () { showPage(idx); });
        tabsEl.appendChild(t);
      })(i);
    }
    var fs = document.createElement('div');
    fs.className = 'tab fs-tab';
    fs.innerHTML = '⛶';
    fs.title = 'Pantalla completa';
    fs.addEventListener('touchstart', function (ev) { ev.preventDefault(); toggleFS(); }, { passive: false });
    fs.addEventListener('click', toggleFS);
    tabsEl.appendChild(fs);
  }

  var cfgVer = null;   // si botones.json cambia (editor de la PC) se recarga sola, quedandose en la misma pagina
  function apply(s) {
    dot.className = 'ok';
    if (s._cfg) {
      if (cfgVer === null) cfgVer = s._cfg;
      else if (cfgVer !== s._cfg) { cfgVer = s._cfg; location.hash = 'p' + cur; location.reload(); return; }
    }
    for (var i = 0; i < allKeys.length; i++) {
      var k = allKeys[i], id = k.getAttribute('data-id');
      if (id && s.hasOwnProperty(id)) {
        k.classList.toggle('on', !!s[id]);
        var lbl = k.querySelector('.lbl'); if (lbl) lbl.textContent = s[id] ? k.getAttribute('data-on') : k.getAttribute('data-off');
      }
    }
  }
  function req(url) { xhrGet(url, function (err, txt) { if (err) { dot.className = ''; return; } var s; try { s = JSON.parse(txt); } catch (e) { return; } apply(s); }); }

  // Navegacion entre paginas: por las pestañas de arriba y por los botones (page / goto).
  // Se quito el gesto de "deslizar" porque confundia un toque normal con un desliz
  // y se comia la accion del boton. Ahora el toque siempre dispara.

  // con el dedo: la accion sale AL TOCAR (instantaneo y a prueba de fallos).
  var lastTouch = 0;   // la tablet ademas del toque simula un clic de mouse -> se ignora el clic si viene justo despues del toque
  function down(ev) {
    var k = ev.currentTarget; ev.preventDefault();
    if (ev.type === 'touchstart') lastTouch = Date.now();
    else if (Date.now() - lastTouch < 1000) return;   // clic sintetico despues de un toque -> ignorar (evita doble disparo)
    if (k.className.indexOf('empty') >= 0) return;
    k.classList.add('pressed');
    fire(k);
  }
  function fire(k) {
    if (navigator.vibrate) navigator.vibrate(15);
    var page = k.getAttribute('data-page');
    if (page) { goToPageByName(page); return; }
    if (k.getAttribute('data-lamp')) {
      var on = k.classList.toggle('on');
      var lbl = k.querySelector('.lbl'); if (lbl) lbl.textContent = on ? k.getAttribute('data-on') : k.getAttribute('data-off');
    }
    var id = k.getAttribute('data-id'); if (id) req('/press?id=' + id);
    var goto = k.getAttribute('data-goto'); if (goto) goToPageByName(goto);
  }
  function up(ev) {
    var k = ev.currentTarget; k.classList.remove('pressed');
    if (ev.type === 'touchend') ev.preventDefault();
  }

  // pantalla completa al primer toque
  function goFS() { var el = document.documentElement; var r = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen || el.mozRequestFullScreen; if (r) { try { r.call(el); } catch (e) {} } }
  document.addEventListener('touchend', goFS, { once: true });
  document.addEventListener('click', goFS, { once: true });

  function onResize() {
    calcLayout();
    applyGridCols(curCols, curSz);
    for (var i = 0; i < gridsMeta.length; i++) fillGrid(gridsMeta[i].grid, gridsMeta[i].count);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 120); });
  function reLayoutSoon() { setTimeout(onResize, 120); setTimeout(onResize, 400); }
  document.addEventListener('fullscreenchange', reLayoutSoon);
  document.addEventListener('webkitfullscreenchange', reLayoutSoon);
  document.addEventListener('mozfullscreenchange', reLayoutSoon);

  // arrancar: traer las paginas desde /config y armarlas TODAS una sola vez
  calcLayout();
  xhrGet('/config', function (err, txt) {
    var cfg; try { cfg = JSON.parse(txt); } catch (e) { cfg = null; }
    pages = (cfg && cfg.pages) ? cfg.pages : [];
    pagesEl.innerHTML = '';
    gridsMeta = [];
    for (var i = 0; i < pages.length; i++) pagesEl.appendChild(makePage(pages[i]));
    buildTabs();
    var hp = parseInt((location.hash || '').replace('#p', ''), 10);
    showPage((hp >= 0 && hp < pages.length) ? hp : 0);
    req('/state');
    setInterval(function () { req('/state'); }, 1500);
  });
</script>
</body>
</html>
