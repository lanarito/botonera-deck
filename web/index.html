<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Botonera</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: Roboto, Arial, sans-serif; }
  body {
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, rgba(0,0,0,0) 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 2px, rgba(0,0,0,0) 2px 7px),
      linear-gradient(165deg, #23262b 0%, #16181c 45%, #0e1012 100%);
  }
  .screw { position: absolute; width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8a8f97 0%, #4b4f56 45%, #22252a 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,.9), inset 0 -1px 2px rgba(0,0,0,.6), 0 0 0 3px rgba(0,0,0,.35); z-index:2; }
  .screw::after { content: ""; position: absolute; left: 4px; right: 4px; top: 10px; height: 2px; background: #1a1c20;
    box-shadow: 0 1px 0 rgba(255,255,255,.18); transform: rotate(35deg); }

  #grid {
    --size: 116px;   /* medida fija del boton (cuadrado) — cambiar aca y todos respetan */
    position: absolute; top: 58px; left: 0; right: 0; bottom: 0; padding: 18px 22px 22px; overflow-y: auto;
    display: grid; grid-template-columns: repeat(auto-fill, var(--size)); gap: 20px;
    justify-content: center; align-content: start;
  }
  #tabs { position: absolute; top: 0; left: 0; right: 0; height: 58px; display: flex; gap: 10px; align-items: center; justify-content: center; z-index: 3; }
  .tab { padding: 7px 22px; border-radius: 12px; font-size: 14px; font-weight: 700; letter-spacing: 1.5px; color: #8a929d;
    background: linear-gradient(180deg, #23262c, #15171b); border: 1px solid #2c313a; box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
  .tab.active { color: #fff; border-color: #5865F2; box-shadow: 0 0 16px -2px #5865F2, inset 0 0 12px -5px #5865F2; text-shadow: 0 0 8px #5865F2; }

  .key { --c: #5865F2; --leak: .6; width: var(--size); height: var(--size); position: relative; touch-action: manipulation; }
  .well { position: absolute; top:0;left:0;right:0;bottom:0; border-radius: 26px;
    background: radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0) 0%, #040506 75%), #040506;
    box-shadow: inset 0 8px 14px rgba(0,0,0,.95), inset 0 -1px 0 rgba(255,255,255,.07), 0 1px 0 rgba(255,255,255,.09), 0 -1px 0 rgba(0,0,0,.6); }
  .well::after { content: ""; position: absolute; top:6px;left:6px;right:6px;bottom:2px; border-radius: 22px;
    box-shadow: 0 0 28px 5px var(--c), 0 0 10px 1px var(--c), inset 0 0 20px 4px var(--c); opacity: var(--leak); transition: opacity .08s; }
  .cap { position: absolute; top:7px;left:7px;right:7px;bottom:7px; border-radius: 21px;
    background: linear-gradient(180deg, #3a3e45 0%, #24272c 55%, #15171a 100%);
    box-shadow: 0 10px 14px rgba(0,0,0,.75), 0 2px 3px rgba(0,0,0,.8), 0 0 18px -3px var(--c);
    transform: translateY(0); transition: transform .06s ease-out, box-shadow .06s; }
  .face { position: absolute; top:2px;left:4px;right:4px;bottom:13px; border-radius: 17px;
    background:
      radial-gradient(ellipse at 50% 22%, rgba(255,255,255,.13) 0%, rgba(255,255,255,0) 55%),
      radial-gradient(ellipse at 50% 60%, #22252b 0%, #2a2e35 70%, #33373f 100%);
    box-shadow: inset 0 2px 1px rgba(255,255,255,.16), inset 0 -3px 5px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
    transition: bottom .06s ease-out; }
  .halo { position: absolute; width: 62%; height: 62%; top: 12%; border-radius: 50%;
    background: radial-gradient(circle, var(--c) 0%, rgba(0,0,0,0) 65%); opacity: .16; transition: opacity .08s; }
  .face svg { position: relative; width: 46%; height: 46%; fill: var(--c);
    filter: drop-shadow(0 0 2px var(--c)) drop-shadow(0 0 9px var(--c)); transition: filter .08s; }
  .face img.ico { position: relative; width: 54%; height: 54%; object-fit: contain; filter: drop-shadow(0 0 7px var(--c)); }
  .lbl { position: relative; margin-top: 7px; font-size: 12px; font-weight: 700; letter-spacing: 1px;
    color: #9aa1aa; text-shadow: 0 1px 0 rgba(255,255,255,.07), 0 -1px 0 rgba(0,0,0,.9); text-align:center; }
  .lamp { position: absolute; top: 12px; left: 50%; width: 30px; height: 6px; margin-left: -15px; border-radius: 3px;
    background: #1b1d21; box-shadow: inset 0 1px 2px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.06); }

  .key.pressed { --leak: .95; }
  .key.pressed .cap { transform: translateY(8px); box-shadow: 0 2px 4px rgba(0,0,0,.85); }
  .key.pressed .face { bottom: 5px; }
  .key.pressed .halo { opacity: .38; }
  .key.pressed svg { filter: drop-shadow(0 0 3px var(--c)) drop-shadow(0 0 16px var(--c)) brightness(1.35); }
  .key.pressed img.ico { filter: drop-shadow(0 0 12px var(--c)) brightness(1.1); }

  /* activado: el icono y la luz del boton quedan mas prendidos */
  .key.on { --leak: .92; }
  .key.on .lamp { background: var(--c); box-shadow: 0 0 6px var(--c), 0 0 16px var(--c), inset 0 1px 1px rgba(255,255,255,.55); }
  .key.on .halo { opacity: .5; }
  .key.on svg { filter: drop-shadow(0 0 3px var(--c)) drop-shadow(0 0 18px var(--c)) brightness(1.4); }
  .key.on .lbl { color: #eef2f8; text-shadow: 0 0 10px var(--c); }

  .key.empty { --leak: 0; }
  .key.empty .cap { box-shadow: 0 8px 12px rgba(0,0,0,.7), 0 2px 3px rgba(0,0,0,.8); }
  .key.empty svg { fill: #33373e; filter: none; }
  .key.empty .halo { opacity: 0; }
  .key.empty .lbl { color: #464b53; }

  #dot { position: absolute; right: 14px; bottom: 10px; width: 9px; height: 9px; border-radius: 50%; background: #c33; box-shadow: 0 0 8px #c33; z-index:2; }
  #dot.ok { background: #2c4; box-shadow: 0 0 8px #2c4; }
</style>
</head>
<body>
<div class="screw" style="left:10px;top:10px"></div><div class="screw" style="right:10px;top:10px"></div>
<div class="screw" style="left:10px;bottom:10px"></div><div class="screw" style="right:10px;bottom:10px"></div>

<div id="tabs"></div>
<div id="grid"></div>
<div id="dot"></div>
<script>
  // ES5 + XMLHttpRequest (compatible con el navegador viejo de la tablet)
  var grid = document.getElementById('grid');
  var dot = document.getElementById('dot');
  var keys = [];

  function xhrGet(url, cb) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.onreadystatechange = function () { if (x.readyState === 4) { cb((x.status >= 200 && x.status < 300) ? null : 1, x.responseText); } };
    try { x.send(); } catch (e) { cb(1, ''); }
  }
  function iconHtml(icon) {
    if (!icon) return '';
    if (icon.indexOf('svg:') === 0) return '<svg class="ico" viewBox="0 0 24 24"><path d="' + icon.substring(4) + '"/></svg>';
    return '<img class="ico" src="' + icon + '" alt="">';
  }

  function buildGrid(buttons) {
    var i, b, k, e;
    for (i = 0; i < buttons.length; i++) {
      b = buttons[i];
      k = document.createElement('div');
      k.className = 'key';
      k.setAttribute('data-id', b.id || '');
      k.setAttribute('data-off', b.label || '');
      if (b.labelOn) k.setAttribute('data-on', b.labelOn);
      if (b.toggle) k.setAttribute('data-lamp', '1');
      k.innerHTML = iconHtml(b.icon);
      grid.appendChild(k);
    }
    for (i = grid.children.length; i < 15; i++) {
      e = document.createElement('div'); e.className = 'key empty'; e.setAttribute('data-off', 'LIBRE');
      e.innerHTML = '<svg class="ico" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>';
      grid.appendChild(e);
    }
    keys = document.querySelectorAll('.key');
    for (i = 0; i < keys.length; i++) {
      k = keys[i];
      var icon = k.innerHTML;
      k.innerHTML = '<div class="well"></div><div class="cap"><div class="face">' +
        (k.getAttribute('data-lamp') ? '<div class="lamp"></div>' : '') +
        '<div class="halo"></div>' + icon +
        '<div class="lbl">' + (k.getAttribute('data-off') || '') + '</div></div></div>';
      k.addEventListener('touchstart', down, { passive: false });
      k.addEventListener('touchend', up); k.addEventListener('touchcancel', up);
      k.addEventListener('mousedown', down); k.addEventListener('mouseup', up); k.addEventListener('mouseleave', up);
    }
  }

  function apply(s) {
    dot.className = 'ok';
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i], id = k.getAttribute('data-id');
      if (id && s.hasOwnProperty(id)) {
        k.classList.toggle('on', !!s[id]);
        var lbl = k.querySelector('.lbl'); if (lbl) lbl.textContent = s[id] ? k.getAttribute('data-on') : k.getAttribute('data-off');
      }
    }
  }
  function req(url) { xhrGet(url, function (err, txt) { if (err) { dot.className = ''; return; } var s; try { s = JSON.parse(txt); } catch (e) { return; } apply(s); }); }

  function down(ev) {
    var k = ev.currentTarget; ev.preventDefault();
    if (k.className.indexOf('empty') >= 0) return;
    k.classList.add('pressed');
    if (navigator.vibrate) navigator.vibrate(15);
    if (k.getAttribute('data-lamp')) {
      var on = k.classList.toggle('on');
      var lbl = k.querySelector('.lbl'); if (lbl) lbl.textContent = on ? k.getAttribute('data-on') : k.getAttribute('data-off');
    }
    var id = k.getAttribute('data-id'); if (id) req('/press?id=' + id);
  }
  function up(ev) { ev.currentTarget.classList.remove('pressed'); }

  // pantalla completa al primer toque (saca la barra del navegador)
  function goFS() { var el = document.documentElement; var r = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen || el.mozRequestFullScreen; if (r) { try { r.call(el); } catch (e) {} } }
  document.addEventListener('touchend', goFS, { once: true });
  document.addEventListener('click', goFS, { once: true });

  // paginas + pestanas
  var pages = [];
  function showPage(idx) {
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].className = (i === idx ? 'tab active' : 'tab');
    grid.innerHTML = '';
    buildGrid(pages[idx] && pages[idx].buttons ? pages[idx].buttons : []);
  }
  function buildTabs() {
    var tb = document.getElementById('tabs'); tb.innerHTML = '';
    for (var i = 0; i < pages.length; i++) {
      (function (idx) {
        var t = document.createElement('div'); t.className = 'tab'; t.textContent = pages[idx].name || ('P' + (idx + 1));
        t.addEventListener('click', function () { showPage(idx); });
        t.addEventListener('touchstart', function (ev) { ev.preventDefault(); showPage(idx); }, { passive: false });
        tb.appendChild(t);
      })(i);
    }
  }
  // arrancar: traer las paginas desde /config
  xhrGet('/config', function (err, txt) {
    var cfg; try { cfg = JSON.parse(txt); } catch (e) { cfg = null; }
    pages = (cfg && cfg.pages) ? cfg.pages : [];
    buildTabs();
    showPage(0);
    req('/state');
    setInterval(function () { req('/state'); }, 1500);
  });
</script>
</body>
</html>
